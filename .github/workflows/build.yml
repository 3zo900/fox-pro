name: Build FOX PRO APK Fixed
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
      - name: Build APK
        run: |
          mkdir -p assets
          cp lib/main.dart /tmp/m.dart
          rm -rf android.dart_tool build
          flutter create --platforms=android. --project-name fox_pro
          cp /tmp/m.dart lib/main.dart
          flutter clean
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FOX-PRO-APK-FIXED
          path: build/app/outputs/flutter-apk/app-release.apk
