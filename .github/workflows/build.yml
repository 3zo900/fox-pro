name: Build FOX PRO APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
      - name: Build APK
        run: |
          cp lib/main.dart /tmp/m.dart
          flutter create. --project-name fox_pro --platforms android --org com.foxpro.app
          cp /tmp/m.dart lib/main.dart
          flutter pub add supabase_flutter video_player chewie
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FOX-PRO-APK
          path: build/app/outputs/flutter-apk/app-release.apk
