workflows:
  android-workflow:
    name: Android Workflow
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Fix structure
        script: |
          cat lib/main.dart > /tmp/m.dart
          flutter create --platforms=android --project-name fox_pro .
          cat /tmp/m.dart > lib/main.dart
          flutter pub get
      - name: Build APK
        script: flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
